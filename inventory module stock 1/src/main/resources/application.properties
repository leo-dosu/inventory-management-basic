spring.application.name=inventory-module

# MySQL 8.4 (same database and user as the rest of the group)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:inventory_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Login for the app (change with APP_USER / APP_PASSWORD)
inventory.login.user=${APP_USER:admin}
inventory.login.password=${APP_PASSWORD:admin123}

server.port=8080
