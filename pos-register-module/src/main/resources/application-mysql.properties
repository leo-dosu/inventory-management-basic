# Activate with: --spring.profiles.active=mysql
# Set DB_USERNAME and DB_PASSWORD in the environment; neither is stored in the repo.
spring.datasource.url=jdbc:mysql://localhost:3306/pos?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
